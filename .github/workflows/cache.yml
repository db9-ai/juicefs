name: "cache"

on:
  push:
    branches:
      - 'main'
      - 'release-**'
    paths:
      - '**/cache.yml'
      - '**/cache.sh'
  pull_request:
    branches:
      - 'main'
      - 'release-**'
    paths:
      - '**/cache.yml'
      - '**/cache.sh'
  schedule:
    - cron:  '30 20 * * *'
  workflow_dispatch:

jobs:
  cache:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Authenticate private Go dependencies
        uses: ./.github/actions/private-go-auth
        with:
          client-id: ${{ vars.SYS9_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYS9_INFRA_APP_PRIVATE_KEY }}

      - name: Remove unused software
        timeout-minutes: 3
        continue-on-error: true
        run: |
          echo "before remove unused software"
          sudo df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "after remove unused software"
          sudo df -h

      - name: mount coverage dir
        timeout-minutes: 5
        uses: ./.github/actions/mount-coverage-dir
        with:
          mount_point: cover
          access_key: ${{ secrets.CI_COVERAGE_AWS_AK }}
          secret_key: ${{ secrets.CI_COVERAGE_AWS_SK }}
          token: ${{ secrets.CI_COVERAGE_AWS_TOKEN }}

      - name: Build
        timeout-minutes: 10
        uses: ./.github/actions/build

      - name: Test
        run: |
          sudo GOCOVERDIR=$(pwd)/cover .github/scripts/cache.sh

      - name: Diagnose MinIO service
        if: failure()
        run: |
          docker ps -a --filter name=minio
          if docker container inspect minio >/dev/null 2>&1; then
            docker inspect --format '{{json .State}}' minio
            docker logs --tail 100 minio
          fi
          curl -v --max-time 10 http://127.0.0.1:9000/minio/health/ready || true

      - name: Check juicefs log
        if: always()
        run: |
          sudo .github/scripts/check_juicefs_log.sh
      
      - name: Check /tmp/juicefs.log
        if: always()
        run: |
          [[ -f /tmp/juicefs.log ]] && sudo tail -n 1000 /tmp/juicefs.log || true

      - name: upload coverage report
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/upload-coverage
        with:
          UPLOAD_TOKEN: ${{ secrets.CI_COVERAGE_FILE_UPLOAD_AUTH_TOKEN }}

      - name: Send Slack Notification
        if: failure()
        uses: juicedata/slack-notify-action@main
        with:
          channel-id: "${{ secrets.SLACK_CHANNEL_ID_FOR_PR_CHECK_NOTIFY }}"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"  
      
      - name: Setup upterm session
        if: failure() && (github.event.inputs.debug == 'true' || github.run_attempt != 1)
        # if: failure()
        timeout-minutes: 60
        uses: lhotari/action-upterm@v1
