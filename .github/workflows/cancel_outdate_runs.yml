name: cancel_outdate_runs
on:
  pull_request:
    branches:
      - main
      - release**

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  cancel-outdate-runs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Cancel outdated pull request runs
        uses: actions/github-script@v7
        with:
          script: |
            const cancel = require('./.github/scripts/cancel_outdated_runs.js');
            await cancel({github, context, core});
