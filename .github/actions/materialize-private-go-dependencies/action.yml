name: Materialize private Go dependencies
description: Export the pinned PD API V3 and TiKV client sources without repository credentials.
runs:
  using: composite
  steps:
    - name: Export PD API V3 client source
      # This exporter revision's client tree matches the go.mod lock at 9adc0789ac45.
      uses: db9-ai/pd/.github/actions/export-source@1bdb8c684ef77f41ebaea67960b03e298a958169
      with:
        source-path: client
    - name: Export TiKV client source
      uses: db9-ai/client-go/.github/actions/export-source@3633819157da496b4c8c977e3ba475ff2df49327
    - name: Configure local Go module replacements
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f go.mod ]]; then
          echo "repository root must contain go.mod" >&2
          exit 1
        fi
        if [[ ! -f .deps/pd/client/go.mod || ! -f .deps/client-go/go.mod || ! -f .deps/pd/.source-ref || ! -f .deps/client-go/.source-ref ]]; then
          echo "exported private Go module source is incomplete" >&2
          exit 1
        fi
        pd_source_ref="$(cat .deps/pd/.source-ref)"
        client_source_ref="$(cat .deps/client-go/.source-ref)"
        if [[ "${pd_source_ref}" != "1bdb8c684ef77f41ebaea67960b03e298a958169" || "${client_source_ref}" != "3633819157da496b4c8c977e3ba475ff2df49327" ]]; then
          echo "exported private Go source does not match the pinned Action revisions" >&2
          exit 1
        fi
        grep -Fqx 'module github.com/tikv/pd/client' .deps/pd/client/go.mod
        grep -Fqx 'module github.com/tikv/client-go/v2' .deps/client-go/go.mod

        grep -Fqx 'replace github.com/tikv/pd/client => github.com/db9-ai/pd/client v0.0.0-20261008163709-9adc0789ac45' go.mod
        grep -Fqx 'replace github.com/tikv/client-go/v2 => github.com/db9-ai/client-go/v2 v2.0.0-20261008164325-ca07349f6de5' go.mod

        pd_replace_count="$(grep -F -c 'replace github.com/tikv/pd/client =>' go.mod || true)"
        client_replace_count="$(grep -F -c 'replace github.com/tikv/client-go/v2 =>' go.mod || true)"
        if [[ "${pd_replace_count}" != 1 || "${client_replace_count}" != 1 ]]; then
          echo "expected one PD client and one TiKV client-go replacement in go.mod" >&2
          exit 1
        fi

        sed -i 's/\r$//' go.mod
        sed -i \
          -e 's#^replace github.com/tikv/pd/client => .*#replace github.com/tikv/pd/client => ./.deps/pd/client#' \
          -e 's#^replace github.com/tikv/client-go/v2 => .*#replace github.com/tikv/client-go/v2 => ./.deps/client-go#' \
          go.mod
        grep -Fq 'replace github.com/tikv/pd/client => ./.deps/pd/client' go.mod
        grep -Fq 'replace github.com/tikv/client-go/v2 => ./.deps/client-go' go.mod
